<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b6e99">
<title>Team Raft 3D</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header class="kopf">
  <div>
    <h1>Team Raft 3D</h1>
    <p id="stand" class="klein">lädt …</p>
  </div>
  <button id="knopf-einstellungen" class="rund" aria-label="Einstellungen">⚙</button>
</header>

<main>
  <section id="ansicht-team" class="ansicht aktiv"></section>
  <section id="ansicht-postfach" class="ansicht"></section>
  <section id="ansicht-aufgaben" class="ansicht"></section>
  <section id="ansicht-projekt" class="ansicht"></section>
</main>

<nav class="leiste">
  <button data-ansicht="team" class="aktiv">Team</button>
  <button data-ansicht="postfach">Postfach <span id="zaehler" class="zaehler" hidden>0</span></button>
  <button data-ansicht="aufgaben">Aufgaben</button>
  <button data-ansicht="projekt">Projekt</button>
</nav>

<div id="blatt" class="blatt" hidden>
  <div class="blatt-innen">
    <button class="schliessen rund" aria-label="Schließen">✕</button>
    <div id="blatt-inhalt"></div>
  </div>
</div>

<div id="meldung" class="meldung" hidden></div>

<script type="module" src="buero.js"></script>
</body>
</html>
