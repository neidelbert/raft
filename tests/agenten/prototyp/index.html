<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Raft 3D – Prototyp</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #6fc3e8; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; }
    #joystick { position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom));
      width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.25);
      border: 2px solid rgba(255,255,255,0.6); touch-action: none; }
    #joystick-knopf { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
      border-radius: 50%; background: rgba(255,255,255,0.85); pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="joystick"><div id="joystick-knopf"></div></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
