<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Übung 9 – Assets</title>
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <canvas id="leinwand"></canvas>
  <div id="oberflaeche">
    <div id="feld-joystick"></div>
    <div id="feld-explosion"></div>
    <button id="knopf-ton" type="button" aria-label="Ton an oder aus"><canvas id="ton-symbol"></canvas></button>
  </div>
  <!-- Ladebildschirm: reines HTML/CSS, erscheint sofort, bevor ein Asset geladen ist. -->
  <div id="laden" class="tafel" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <p>Lädt …</p>
    <div class="balken"><div id="balken-fuellung"></div></div>
  </div>
  <div id="start" class="tafel" hidden>
    <p>Tippen zum Starten</p>
    <p class="hinweis">Links: Daumen lässt den Helden laufen. Rechts: Tippen für eine Explosion.</p>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
